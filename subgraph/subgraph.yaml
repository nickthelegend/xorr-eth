specVersion: 1.0.0
description: xorr delegation — capped, venue-scoped, revocable bot trading permissions on Base.
repository: https://github.com/xorr-finance/xorr-eth
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: XorrDelegation
    network: base
    source:
      abi: XorrDelegation
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Policy
        - Venue
        - Spend
        - DailySpend
      abis:
        - name: XorrDelegation
          file: ./abis/XorrDelegation.json
      eventHandlers:
        - event: Granted(indexed address,indexed address,uint256,uint64)
          handler: handleGranted
        - event: Revoked(indexed address,indexed address)
          handler: handleRevoked
        - event: VenueAllowed(indexed address,indexed address,bool)
          handler: handleVenueAllowed
        - event: Spent(indexed address,indexed address,indexed address,address,uint256,uint256)
          handler: handleSpent
      file: ./src/mapping.ts
