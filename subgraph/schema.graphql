# The Graph — xorr delegation index.
#
# The app reads its own permission history from the CHAIN rather than from our database. That
# matters here more than in most apps: the whole product claim is "you can see exactly what the
# bot did and take its permission away". A history only we hold is a history the user has to
# take on trust.

type Policy @entity(immutable: false) {
  "The owner address, lowercased."
  id: ID!
  owner: Bytes!
  delegate: Bytes!
  "Daily cap in USDC base units."
  dailyCap: BigInt!
  expiresAt: BigInt!
  revoked: Boolean!
  "Total ever spent under this policy, across all days."
  totalSpent: BigInt!
  grantedAt: BigInt!
  grantedTx: Bytes!
  revokedAt: BigInt
  revokedTx: Bytes
  venues: [Venue!]! @derivedFrom(field: "policy")
  spends: [Spend!]! @derivedFrom(field: "policy")
}

type Venue @entity(immutable: false) {
  "owner-venue"
  id: ID!
  policy: Policy!
  venue: Bytes!
  allowed: Boolean!
  updatedAt: BigInt!
}

"Every trade the bot made with the user's capital."
type Spend @entity(immutable: true) {
  id: ID!
  policy: Policy!
  owner: Bytes!
  delegate: Bytes!
  venue: Bytes!
  token: Bytes!
  amount: BigInt!
  "Running total for the UTC day the trade landed in — what the cap is checked against."
  spentToday: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

"One row per owner per UTC day, so the app can chart spend against the cap over time."
type DailySpend @entity(immutable: false) {
  "owner-dayIndex"
  id: ID!
  owner: Bytes!
  day: BigInt!
  total: BigInt!
  tradeCount: Int!
}
